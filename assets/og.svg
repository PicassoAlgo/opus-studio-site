<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Opus Studio — Sites web premium pour PME suisses">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1116"/>
      <stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="22%" r="55%">
      <stop offset="0" stop-color="#2F81F7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2F81F7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#21262D" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Marque -->
  <g transform="translate(80, 96)">
    <text x="0" y="0" font-family="-apple-system, 'Space Grotesk', sans-serif" font-size="36" font-weight="700" fill="#E6EDF3" letter-spacing="-1">
      Opus <tspan fill="#2F81F7">Studio</tspan>
    </text>
    <text x="0" y="32" font-family="-apple-system, Inter, sans-serif" font-size="18" fill="#8B949E" letter-spacing="2" text-transform="uppercase">
      ROMONT · SUISSE
    </text>
  </g>

  <!-- Headline -->
  <g transform="translate(80, 280)">
    <text font-family="-apple-system, 'Space Grotesk', sans-serif" font-size="88" font-weight="700" fill="#E6EDF3" letter-spacing="-3" line-height="1">
      <tspan x="0" dy="0">Un site qui</tspan>
      <tspan x="0" dy="100" font-style="italic" fill="#2F81F7">vous ressemble.</tspan>
    </text>
  </g>

  <!-- Sub-line + CTA chip -->
  <g transform="translate(80, 540)">
    <text font-family="-apple-system, Inter, sans-serif" font-size="22" fill="#8B949E">
      Maquette gratuite en 48 h · Livré en 14 jours · Dès 890 CHF
    </text>
  </g>

  <!-- Coin chip "STUDIO" -->
  <g transform="translate(1000, 80)">
    <rect width="120" height="32" rx="16" fill="#2F81F7" opacity="0.15"/>
    <rect width="120" height="32" rx="16" fill="none" stroke="#2F81F7" stroke-width="1"/>
    <text x="60" y="22" font-family="-apple-system, Inter, sans-serif" font-size="14" font-weight="600" fill="#58A6FF" text-anchor="middle" letter-spacing="2">
      STUDIO
    </text>
  </g>
</svg>
