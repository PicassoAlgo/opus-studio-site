<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Opus Studio — Création de sites web pour PME suisses">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E13"/>
      <stop offset="1" stop-color="#13171F"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="18%" r="62%">
      <stop offset="0" stop-color="#4A8FFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4A8FFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Marque Opus.studio -->
  <g transform="translate(80, 110)">
    <rect x="0" y="-27" width="42" height="42" rx="12" fill="#4A8FFF"/>
    <text x="21" y="1" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">O</text>
    <text x="58" y="3" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="600" fill="#FAFAF7" letter-spacing="-0.5">Opus<tspan font-style="italic" fill="#6FA8FF">.studio</tspan></text>
  </g>

  <!-- Headline -->
  <g transform="translate(80, 300)">
    <text font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="700" fill="#FAFAF7" letter-spacing="-2.5">
      <tspan x="0" dy="0">Vous gérez votre métier.</tspan>
      <tspan x="0" dy="92" font-style="italic" font-weight="400" fill="#6FA8FF">On gère votre site.</tspan>
    </text>
  </g>

  <!-- Sous-ligne -->
  <g transform="translate(80, 552)">
    <text font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#A8B0BC">
      Création de sites web pour PME suisses · Maquette gratuite · dès 890 CHF
    </text>
  </g>

  <!-- Chip coin -->
  <g transform="translate(998, 86)">
    <rect width="122" height="34" rx="17" fill="#4A8FFF" fill-opacity="0.15"/>
    <rect width="122" height="34" rx="17" fill="none" stroke="#4A8FFF" stroke-opacity="0.5" stroke-width="1"/>
    <text x="61" y="23" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#6FA8FF" text-anchor="middle" letter-spacing="2">STUDIO</text>
  </g>
</svg>
